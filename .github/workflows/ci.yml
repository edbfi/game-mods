# SPDX-License-Identifier: AGPL-3.0-or-later
# From edbfi-ci templates/ci-shell.yml, plus the root Rust workspace. Every added PR job belongs in ci-ok.
# No paths: filter: a skipped workflow leaves the required checks pending.
name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "47 3 * * 0" }]   # weekly main revalidation; minute unique per repo
permissions: {}
# The head SHA keeps a re-run from cancelling a newer head; main runs never cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The MSVC CRT and Windows SDK that cargo-xwin links Windows builds against.
  XWIN_VERSION: "17"
  XWIN_SDK_VERSION: 10.0.26100
  XWIN_CRT_VERSION: 14.44.17.14
  XWIN_ARCH: x86_64
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install   # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-xwin@0.23.1 }
      - name: Install clang and llvm-rc for Windows resources
        run: |
          bash scripts/apt-install.sh clang-18 llvm-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with: { extra-args: "--all-files --hook-stage manual" }
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    env: { EDBFI_COMMIT: "${{ github.sha }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: "just,cargo-xwin@0.23.1" }
      - run: |
          bash scripts/apt-install.sh lua5.1 clang-18 llvm-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just test
      - run: just build
      # The zip a nightly ships, checked as package-mod.sh checks it, then handed to the windows job.
      - name: Package the trainer
        run: |
          bash scripts/package-mod.sh metro-2033-redux/trainer 0.0.0 "$RUNNER_TEMP/trainer"
          mkdir -p candidate && cp metro-2033-redux/trainer/dist/metro-2033-redux-trainer-0.0.0.zip candidate/
          (cd candidate && sha256sum metro-2033-redux-trainer-0.0.0.zip > metro-2033-redux-trainer-0.0.0.zip.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: trainer-zip, path: candidate/, retention-days: 7, if-no-files-found: error }
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions: { contents: read }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --workspace -- --test-threads=1
      # Checked from the runner's temp folder, a Windows path, as release.yml and nightly.yml check theirs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: trainer-zip, path: "${{ runner.temp }}/zip" }
      - name: Verify the packaged trainer
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/zip/metro-2033-redux-trainer-0.0.0.zip"
          expected="$(cut -d' ' -f1 "$zip.sha256")"
          actual="$(sha256sum < "$zip" | cut -d' ' -f1)"
          [[ "$actual" == "$expected" ]] || { echo "::error::sha256 $actual, build reported $expected"; exit 1; }
          python3 -m zipfile -e "$zip" "$RUNNER_TEMP/files"
          bash scripts/verify-mod-artifact.sh metro-2033-redux/trainer 0.0.0 "$RUNNER_TEMP/files"
      - name: Run the executable tests against the packaged executable
        env: { EDBFI_TRAINER_EXE: "${{ runner.temp }}/files/metro-trainer/metro-trainer.exe" }
        run: cargo test --locked -p metro-2033-redux-trainer --test cli --test console_close -- --test-threads=1
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-deny@0.20.2 }
      - run: cargo deny --locked --workspace check bans licenses sources
  # Advisories change without our commits, so they never block a PR.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-deny@0.20.2 }
      - run: cargo deny --locked --workspace check advisories
  ci-ok:
    if: always()
    needs: [checks, build, windows, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ""
        run: |
          jq -e --arg skips "$ALLOWED_SKIPS" '
            ($skips | split(",") | map(select(. != ""))) as $allowed
            | length > 0 and all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and (.key | IN($allowed[]))))
          ' <<<"$NEEDS" >/dev/null || { echo "::error::ci-ok failed: $(jq -c 'map_values(.result)' <<<"$NEEDS")"; exit 1; }
