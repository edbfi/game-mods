# SPDX-License-Identifier: AGPL-3.0-or-later
# Release automation, after EasyHDR's release.yml. Publish a GitHub release tagged
# <game>/<mod>/v<semver>, e.g. metro-2033-redux/trainer/v0.1.0. Then:
#   verify   (unprivileged) the tag names a mod at the released commit, which is on main;
#   ci       (unprivileged) waits until CI has passed on that commit, alongside build and windows;
#   build    (unprivileged) packages the mod with scripts/package-mod.sh, which checks the zip;
#   windows  (unprivileged) runs the zip's executables, if any, and uploads nothing;
#   publish  (privileged: VT_API_KEY, contents: write; shell only, no actions) takes the
#            zip in, submits it to VirusTotal and attaches it and the report links.
# A failed publish is retried with "Re-run failed jobs": it reuses the built artifact,
# replaces the asset and the report block, and resubmits the same file.
name: Release
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # The MSVC CRT and Windows SDK that cargo-xwin links Windows builds against, as in ci.yml.
  XWIN_VERSION: "17"
  XWIN_SDK_VERSION: 10.0.26100
  XWIN_CRT_VERSION: 14.44.17.14
  XWIN_ARCH: x86_64
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    outputs:
      game: ${{ steps.tag.outputs.game }}
      mod: ${{ steps.tag.outputs.mod }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        name: Require a mod tag whose commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          re='^([a-z0-9]+(-[a-z0-9]+)*)/([a-z0-9]+(-[a-z0-9]+)*)/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
          [[ "$TAG" =~ $re ]] || { echo "::error::Release tags look like <game>/<mod>/v1.2.3"; exit 1; }
          game="${BASH_REMATCH[1]}" mod="${BASH_REMATCH[3]}" version="${BASH_REMATCH[5]}"
          # The tag must still point at the event's commit.
          tagged="$(gh api "repos/$GH_REPO/commits/refs/tags/$(jq -rn --arg t "$TAG" '$t | @uri')" --jq .sha)"
          if [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG points at '$tagged', not the released commit $GITHUB_SHA"
            exit 1
          fi
          # compare/<commit>...main is "ahead" or "identical" only when main contains the commit.
          status="$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...main" --jq .status)"
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "::error::$GITHUB_SHA is not reachable from main (compare status: $status)"
            exit 1
          fi
          gh api "repos/$GH_REPO/contents/$game/$mod/justfile?ref=$GITHUB_SHA" --jq .type > /dev/null ||
            { echo "::error::No mod at $game/$mod in $GITHUB_SHA"; exit 1; }
          { echo "game=$game"; echo "mod=$mod"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
          echo "$TAG ($GITHUB_SHA) is on main"

  ci:
    needs: verify
    runs-on: ubuntu-latest
    # Room for a just-merged commit's CI run to finish.
    timeout-minutes: 65
    permissions: { actions: read }
    steps:
      - name: Require successful CI on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Any non-PR CI run of this commit on main counts. A just-merged commit's run may still be going.
          deadline=$((SECONDS + 60 * 60))
          while :; do
            runs="$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --limit 100 \
              --json event,status,conclusion \
              --jq '[.[] | select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")]')"
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed on $GITHUB_SHA"; break
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo "::error::CI failed on $GITHUB_SHA; re-run it, then re-run failed jobs"; exit 1
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::No finished CI run on main for $GITHUB_SHA after an hour; re-run failed jobs once it passes"; exit 1
            fi
            sleep 30
          done

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    outputs:
      artifact: ${{ steps.check.outputs.artifact }}
      sha256: ${{ steps.check.outputs.sha256 }}
    env:
      GAME: ${{ needs.verify.outputs.game }}
      MOD: ${{ needs.verify.outputs.mod }}
      VERSION: ${{ needs.verify.outputs.version }}
      EDBFI_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # No build cache in a release (zizmor cache-poisoning).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: "just,cargo-xwin@0.23.1" }
      - run: rustup toolchain install   # the version in rust-toolchain.toml
      # Lua checks the Dawn of War scripts; clang and llvm-rc build the trainer's Windows resources.
      - run: |
          bash scripts/apt-install.sh lua5.1 clang-18 llvm-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - id: check
        env:
          ARTIFACT: ${{ needs.verify.outputs.game }}-${{ needs.verify.outputs.mod }}-zip-${{ github.run_attempt }}
        run: |
          bash scripts/package-mod.sh "$GAME/$MOD" "$VERSION"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.check.outputs.artifact }}
          path: ${{ steps.check.outputs.zip }}
          retention-days: 7
          if-no-files-found: error

  windows:
    needs: [verify, build]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions: { contents: read }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/zip
      - name: Run the zip's files
        env:
          GAME: ${{ needs.verify.outputs.game }}
          MOD: ${{ needs.verify.outputs.mod }}
          VERSION: ${{ needs.verify.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/zip/$GAME-$MOD-$VERSION.zip"
          # From stdin: sha256sum prefixes its line with \ when the file name holds one, as Windows paths do.
          actual="$(sha256sum < "$zip" | cut -d' ' -f1)"
          [[ "$actual" == "$EXPECTED_SHA256" ]] || { echo "::error::sha256 $actual, build reported $EXPECTED_SHA256"; exit 1; }
          python3 -m zipfile -e "$zip" "$RUNNER_TEMP/files"
          bash scripts/verify-mod-artifact.sh "$GAME/$MOD" "$VERSION" "$RUNNER_TEMP/files"

  publish:
    needs: [ci, build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write, actions: read }
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Take the zip in
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT" =~ ^[a-z0-9-]+-zip-[0-9]+$ && "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::Malformed build outputs"; exit 1; }
          # The file name comes from the tag, never from the build.
          re='^([a-z0-9]+(-[a-z0-9]+)*)/([a-z0-9]+(-[a-z0-9]+)*)/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
          [[ "$TAG" =~ $re ]] || { echo "::error::Malformed tag"; exit 1; }
          name="${BASH_REMATCH[1]}-${BASH_REMATCH[3]}-${BASH_REMATCH[5]}.zip"
          # The tag must not have moved since verify.
          tagged="$(gh api "repos/$GH_REPO/commits/refs/tags/$(jq -rn --arg t "$TAG" '$t | @uri')" --jq .sha)"
          [[ "$tagged" == "$GITHUB_SHA" ]] || { echo "::error::Tag $TAG moved to '$tagged'"; exit 1; }
          # Artifact intake (edbfi-ci's privileged_jobs.py): a fresh directory, exactly one regular file.
          dir="$(mktemp -d)"
          gh run download "$GITHUB_RUN_ID" -n "$ARTIFACT" -D "$dir"
          mapfile -d '' entries < <(find "$dir" -mindepth 1 -print0)
          zip="$dir/$name"
          if [[ ${#entries[@]} -ne 1 || "${entries[0]}" != "$zip" || -L "$zip" || ! -f "$zip" ]]; then
            echo "::error::The artifact must hold exactly one regular file, $name"
            exit 1
          fi
          [[ "$(head -c 2 "$zip")" == PK ]] || { echo "::error::$name is not a zip"; exit 1; }
          actual="$(sha256sum "$zip" | cut -d' ' -f1)"
          [[ "$actual" == "$EXPECTED_SHA256" ]] || { echo "::error::sha256 $actual, build reported $EXPECTED_SHA256"; exit 1; }
          # The VirusTotal script comes from the released commit, which verify found on main.
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GH_REPO/contents/scripts/release-virustotal.sh?ref=$GITHUB_SHA" > "$RUNNER_TEMP/release-virustotal.sh"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Submit to VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/release-virustotal.sh" scan "$ZIP" "$RUNNER_TEMP/virustotal.md"
          cat "$RUNNER_TEMP/virustotal.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the zip and the report links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ZIP" --clobber
          gh release view "$TAG" --json body > "$RUNNER_TEMP/release.json"
          bash "$RUNNER_TEMP/release-virustotal.sh" notes "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/virustotal.md" "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
