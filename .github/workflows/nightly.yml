# SPDX-License-Identifier: AGPL-3.0-only
# Nightly builds of every mod, on each push to main and weekly, so one stays within the 90-day
# artifact retention (immortality.yml keeps the schedule enabled). nightly.link serves the
# most recently updated successful push or schedule run on main: re-run only the newest run.
#   mods   (unprivileged) lists every <game>/<mod>/justfile;
#   build  (unprivileged) tests and packages each mod and uploads the zip's files as the
#          artifact <game>-<mod>-nightly, which GitHub zips once;
#   verify (unprivileged, Windows) runs each artifact's executables, if any, and uploads nothing;
#   scan   (privileged: VT_API_KEY; shell only, no actions) takes in exactly those artifact
#          zips, the bytes users download, and submits them to VirusTotal;
#   readme (privileged: NIGHTLY_DEPLOY_KEY; shell only, no actions) points the README's
#          VirusTotal links at those zips and pushes straight to main, as homebrew-taps'
#          updater does: a deploy key bypasses main's ruleset, which GITHUB_TOKEN can't.
#          A newer push cancels this run first, so main gets only the newest links.
name: Nightly
on:
  # The readme job's own commits change only README.md, which no build reads.
  push: { branches: [main], paths-ignore: [README.md] }
  schedule: [{ cron: "29 4 * * 1" }]
permissions: {}
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true
env:
  # The MSVC CRT and Windows SDK that cargo-xwin links Windows builds against, as in ci.yml.
  XWIN_VERSION: "17"
  XWIN_SDK_VERSION: 10.0.26100
  XWIN_CRT_VERSION: 14.44.17.14
  XWIN_ARCH: x86_64
jobs:
  mods:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: list
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*/*/justfile)
          mods="$(printf '%s\n' "${files[@]%/justfile}" | jq -Rnc '[inputs | split("/") | {game: .[0], mod: .[1]}]')"
          jq -e 'length > 0 and all(.[]; (.game + "/" + .mod) | test("^[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*$"))' \
            <<<"$mods" >/dev/null || { echo "::error::Mods live in <game>/<mod> kebab-case folders: $mods"; exit 1; }
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

  build:
    needs: mods
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mods.outputs.mods) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    env:
      GAME: ${{ matrix.game }}
      MOD: ${{ matrix.mod }}
      EDBFI_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # No build cache: these builds are published.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with: { tool: "just,cargo-xwin@0.23.1" }
      - run: rustup toolchain install   # the version in rust-toolchain.toml
      # Lua checks the Dawn of War scripts; clang and llvm-rc build the trainer's Windows resources.
      - run: |
          bash scripts/apt-install.sh lua5.1 clang-18 llvm-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - run: just --justfile "$GAME/$MOD/justfile" --working-directory "$GAME/$MOD" test
      # Nightlies have no version: 0.0.0 only names the zip extracted here. The scan summary names a build by commit and run.
      - run: bash scripts/package-mod.sh "$GAME/$MOD" 0.0.0 "$RUNNER_TEMP/nightly"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.game }}-${{ matrix.mod }}-nightly
          path: ${{ runner.temp }}/nightly/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  verify:
    needs: [mods, build]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions: { contents: read }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "*-nightly", path: "${{ runner.temp }}/nightly" }
      - name: Run each mod's packaged files
        env:
          MODS: ${{ needs.mods.outputs.mods }}
        run: |
          set -euo pipefail
          # Read first, so a failed jq fails the step instead of verifying nothing. Windows jq ends lines with CRLF.
          rows="$(jq -r '.[] | [.game, .mod] | @tsv' <<<"$MODS" | tr -d '\r')"
          while IFS=$'\t' read -r game mod; do
            bash scripts/verify-mod-artifact.sh "$game/$mod" 0.0.0 "$RUNNER_TEMP/nightly/$game-$mod-nightly" </dev/null
          done <<<"$rows"

  scan:
    needs: [mods, build, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Each mod takes up to about 6 minutes, 5 of them polling VirusTotal: room for about 10 mods.
    timeout-minutes: 60
    permissions: { actions: read, contents: read }
    outputs:
      scanned: ${{ steps.submit.outputs.scanned }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Take the artifact zips in
        env:
          GH_TOKEN: ${{ github.token }}
          MODS: ${{ needs.mods.outputs.mods }}
        run: |
          set -euo pipefail
          expected="$(jq -ce '[.[] | "\(.game)-\(.mod)-nightly"] | sort' <<<"$MODS")"
          gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | {id, name, digest}' | jq -s . > "$RUNNER_TEMP/artifacts.json"
          # Exactly one artifact per mod, each with a well-formed id, name and digest.
          jq -e --argjson expected "$expected" '
            ([.[].name] | sort) == $expected
            and all(.[]; (.id | type == "number")
              and (.name | test("^[a-z0-9]+(-[a-z0-9]+)*-nightly$"))
              and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))
          ' "$RUNNER_TEMP/artifacts.json" >/dev/null ||
            { echo "::error::Expected artifacts $expected, got $(jq -c 'map({name, digest})' "$RUNNER_TEMP/artifacts.json")"; exit 1; }
          dir="$(mktemp -d)"
          : > "$RUNNER_TEMP/zips.txt"
          while IFS=$'\t' read -r id name digest; do
            zip="$dir/$name.zip"
            # The raw artifact zip, never extracted here.
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$zip"
            [[ "$(head -c 2 "$zip")" == PK ]] || { echo "::error::$name is not a zip"; exit 1; }
            actual="sha256:$(sha256sum "$zip" | cut -d' ' -f1)"
            [[ "$actual" == "$digest" ]] || { echo "::error::$name is $actual; GitHub recorded $digest"; exit 1; }
            echo "$zip" >> "$RUNNER_TEMP/zips.txt"
          done < <(jq -r '.[] | [.id, .name, .digest] | @tsv' "$RUNNER_TEMP/artifacts.json")
          # The VirusTotal script comes from this run's commit, which the job guard keeps on main.
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GH_REPO/contents/scripts/release-virustotal.sh?ref=$GITHUB_SHA" > "$RUNNER_TEMP/release-virustotal.sh"
      - name: Submit to VirusTotal
        id: submit
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          # Each row goes into the summary as soon as it exists, so a later failure keeps it.
          {
            echo "### Nightly build of \`${GITHUB_SHA:0:7}\`, run $GITHUB_RUN_NUMBER"
            echo
            echo 'Download the artifacts below, or through the links in the README. VirusTotal scanned these exact zips.'
            echo
            echo '| File | SHA-256 | Analysis | Reports |'
            echo '| --- | --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          first=1
          while read -r zip; do
            # The script spaces its own requests; space the files too.
            ((first)) || sleep 15
            first=0
            bash "$RUNNER_TEMP/release-virustotal.sh" scan "$zip" "$RUNNER_TEMP/virustotal.md"
            grep '^| `' "$RUNNER_TEMP/virustotal.md" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/zips.txt"
          echo "scanned=$(jq -c 'map({name, sha256: (.digest | ltrimstr("sha256:"))})' "$RUNNER_TEMP/artifacts.json")" >> "$GITHUB_OUTPUT"

  readme:
    needs: scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Push the README's VirusTotal links with the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.NIGHTLY_DEPLOY_KEY }}
          SCANNED: ${{ needs.scan.outputs.scanned }}
          REMOTE: git@github.com:${{ github.repository }}.git
        run: |
          set -euo pipefail
          # One reference link per scanned zip, named vt-<game>-<mod> for the README's table.
          links="$(jq -re '
            if length > 0 and all(.[]; (.name | test("^[a-z0-9]+(-[a-z0-9]+)*-nightly$"))
              and (.sha256 | test("^[0-9a-f]{64}$")))
            then sort_by(.name)[] | "[vt-\(.name | rtrimstr("-nightly"))]: https://www.virustotal.com/gui/file/\(.sha256)/detection"
            else error("unexpected scan output") end' <<<"$SCANNED")"
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          unset DEPLOY_KEY
          # known_hosts from GitHub's published host keys; never trust on first use.
          curl -fsS --proto '=https' https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          if [[ ! -s "$ssh_dir/known_hosts" ]] ||
            grep -Ev '^github\.com (ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa) [A-Za-z0-9+/=]+$' "$ssh_dir/known_hosts"
          then
            echo "::error::Unexpected GitHub SSH host keys"
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $ssh_dir/key -o IdentitiesOnly=yes -o IdentityAgent=none -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes"
          for try in 1 2 3; do
            src="$(mktemp -d)"
            git -c core.hooksPath=/dev/null clone -q --depth 1 --branch main "$REMOTE" "$src"
            # Replace the lines between the markers; anything but one start then one end fails.
            LINKS="$links" awk '
              $0 == "<!-- nightly-virustotal:start -->" { if (state) exit 2; print; print ENVIRON["LINKS"]; state = 1; next }
              $0 == "<!-- nightly-virustotal:end -->" { if (state != 1) exit 2; state = 2 }
              state != 1 { print }
              END { if (state != 2) exit 2 }
            ' "$src/README.md" > "$ssh_dir/README.md" || { echo "::error::README.md needs one pair of nightly-virustotal markers"; exit 1; }
            if cmp -s "$ssh_dir/README.md" "$src/README.md"; then
              echo "The README already links these zips."
              exit 0
            fi
            cp "$ssh_dir/README.md" "$src/README.md"
            git -C "$src" -c core.hooksPath=/dev/null add README.md
            git -C "$src" -c core.hooksPath=/dev/null \
              -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q --signoff -m "docs: point the nightly VirusTotal links at ${GITHUB_SHA:0:7}"
            if err="$(git -C "$src" -c core.hooksPath=/dev/null push -q origin HEAD:refs/heads/main 2>&1)"; then
              echo "Pushed the VirusTotal links for ${GITHUB_SHA:0:7}."
              exit 0
            fi
            echo "$err"
            grep -Eq 'non-fast-forward|fetch first|\[rejected\]' <<<"$err" || { echo "::error::The push failed"; exit 1; }
            echo "main moved (try $try); retrying from a fresh clone."
          done
          echo "::error::main kept moving"
          exit 1
