; Metro 2033 Redux trainer. Master starts active after validated attachment.
; Set enabled=false to start paused. Feature selections below are independent.
; Settings accept only lowercase true or false. Unknown and duplicate entries
; are errors. Restart the trainer after editing this file.
[trainer]
enabled=true
sounds=true
; Preserve normal Hellsing pressure with ammo/no reload; restart after changing.
preserve_weapon_pressure=true

[features]
; Preserve reserve ammunition consumed by reloading. Loaded rounds still
; decrease when firing, and the weapon must still be reloaded.
unlimited_ammo=false
; Preserve throwable inventory while keeping the normal throwing action.
unlimited_throwables=false
; Preserve medkit inventory while keeping the normal healing action.
unlimited_medkits=false
; Preserve usable gas filter time.
unlimited_filters=false
; Prevent damage to the worn gas mask.
indestructible_mask=false

; Preserve loaded rounds, health, and flashlight charge.
no_reload=false
god_mode=false
unlimited_flashlight=false
; Currency remains unavailable.
unlimited_currency=false

; Individual weapon selectors; global no_reload enables all.
no_reload_ak74=false
no_reload_aksu=false
no_reload_rpk=false
no_reload_ashot=false
no_reload_vsv=false
no_reload_ventil=false
no_reload_padonag=false
no_reload_preved=false
no_reload_vyhlop=false
no_reload_saiga=false
no_reload_tumak=false
no_reload_2012=false
no_reload_gatling=false
no_reload_ubludok=false
no_reload_uboynicheg=false
no_reload_bigun=false
no_reload_duplet=false
no_reload_revolver=false
no_reload_abzac=false
no_reload_hellbreath=false
no_reload_hellshock=false
no_reload_tihar=false
no_reload_helsing=false
no_reload_flamethrower=false

; Soft low-volume chimes are controlled by sounds=true in [trainer].
; Optional CTRL+, ALT+, SHIFT+ modifiers can be combined; use + or -.
; Bindings: SPACE, F1-F24, A-Z, 0-9, INSERT, DELETE, HOME, END,
; PAGEUP, PAGEDOWN, PAUSE, or NONE. Each non-NONE binding must be unique.
; Keys trigger once per press; release before pressing again.
[hotkeys]
enabled=ALT+SPACE
unlimited_ammo=ALT+F1
unlimited_throwables=ALT+F2
unlimited_medkits=ALT+F3
unlimited_filters=ALT+F4
indestructible_mask=ALT+F5
no_reload=ALT+1
god_mode=ALT+2
unlimited_flashlight=ALT+3
