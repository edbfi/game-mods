[package]
name = "metro-2033-redux-trainer"
description = "Trainer for the Steam build of Metro 2033 Redux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "metro-trainer"
path = "src/main.rs"

[dependencies]
edbfi-trainer.workspace = true

[dev-dependencies]
crossterm = { workspace = true, features = ["events"] }
edbfi-trainer = { workspace = true, features = ["simulate"] }
edbfi-tui.workspace = true
insta.workspace = true
proptest.workspace = true
ratatui.workspace = true

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
