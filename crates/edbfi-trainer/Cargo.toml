[package]
name = "edbfi-trainer"
description = "Process attachment, verified hooks and settings for edbfi game trainers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lets simulations and dashboard tests create acknowledgements no game saw. Never enable it in a trainer.
simulate = []

[dependencies]
iced-x86.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest.workspace = true
